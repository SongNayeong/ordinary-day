<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>첫 손님 출동 배틀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#232042; --paper:#fffaf0; --line:#e2d3b3; --navy:#1f3a6e; --gold:#f2b632; --foe:#d2502e; --new:#2f9b58; --spell:#2f6fd0;
  --fire:#e8673f; --water:#3b8fe0; --road:#e0a800; --cold:#57b9e6; --gen:#7d8aa8;
  --title:'Jua','Gowun Dodum',system-ui,sans-serif; --body:'Gowun Dodum','Jua',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#111a33;color:var(--ink);font-family:var(--body);user-select:none;-webkit-user-select:none}
button{font-family:var(--title);cursor:pointer;border:none;color:inherit}
#app{position:fixed;inset:0;display:flex;justify-content:center}
.screen{width:100%;max-width:920px;height:100%;position:relative;overflow:hidden}
.bg-spring{background:linear-gradient(180deg,#ffd6e2 0%,#fff1d6 45%,#cfeebd 100%)}
.bg-summer{background:linear-gradient(180deg,#9fc0ea 0%,#d6ebf7 45%,#b3dccf 100%)}
.bg-autumn{background:linear-gradient(180deg,#ffcf9c 0%,#ffefd6 45%,#ecc9a5 100%)}
.bg-winter{background:linear-gradient(180deg,#c8dcf6 0%,#f2f7ff 45%,#d4e1f3 100%)}
.bg-office{background:radial-gradient(circle at 50% 18%,#33569a 0%,#1a2b52 55%,#0f1730 100%)}
.f-fire{--fc:var(--fire)}.f-water{--fc:var(--water)}.f-road{--fc:var(--road)}.f-cold{--fc:var(--cold)}.f-gen{--fc:var(--gen)}
.chip{display:inline-block;background:var(--fc,#888);color:#fff;border-radius:999px;padding:0 7px;font-size:11px;font-family:var(--title);line-height:17px;vertical-align:middle}

/* title */
.title-wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:16px}
.badge-top{font-family:var(--title);background:#fff;color:var(--navy);border-radius:999px;padding:4px 14px;font-size:14px}
.lineup{display:flex;gap:clamp(6px,2vw,18px);align-items:flex-end;margin:6px 0}
.lineup .sp{font-size:clamp(40px,9vh,70px);position:relative;animation:idle 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.4))}
.lineup .sp i{position:absolute;right:-14%;bottom:-6%;font-size:.48em;font-style:normal}
.lineup .vsx{font-family:var(--title);font-size:28px;color:#ff9b7a;align-self:center}
.title-wrap h1{font-family:var(--title);font-weight:normal;font-size:clamp(50px,12vw,92px);margin:0;letter-spacing:3px;color:#ffe9a8;text-shadow:0 5px 0 #b8701f,0 10px 26px rgba(0,0,0,.5)}
.title-wrap .sub{font-size:clamp(15px,3.6vw,20px);opacity:.92}
.title-wrap .copy{font-family:var(--title);font-size:clamp(18px,4.4vw,26px);color:#bff3d2}
.big-btn{font-size:21px;padding:13px 36px;border-radius:999px;background:linear-gradient(#ffd25e,#f2a52b);color:#4a2a00!important;box-shadow:0 5px 0 #b86b1f,0 10px 24px rgba(0,0,0,.35);transition:transform .1s}
.big-btn:hover{transform:translateY(-2px) scale(1.03)}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b86b1f}
.ghost-btn{background:rgba(255,255,255,.12);color:#fff!important;border:2px solid rgba(255,255,255,.8);border-radius:999px;padding:8px 20px;font-size:15px}
.small-note{font-size:12px;opacity:.55;max-width:560px}

/* cut */
.cut{height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;position:relative;cursor:pointer}
.cut .speaker{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(90px,22vh,170px);filter:drop-shadow(0 10px 14px rgba(0,0,0,.25));animation:popc .35s ease}
.cut .prop{position:absolute;left:50%;top:13%;transform:translateX(-50%);font-family:var(--title);font-size:17px;background:rgba(255,255,255,.9);padding:6px 16px;border-radius:999px;white-space:nowrap}
.cut .box{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:16px 18px 12px;box-shadow:0 6px 0 var(--ink);position:relative;min-height:108px;animation:rise .25s ease;max-width:820px;margin:0 auto;width:100%}
.cut .name{position:absolute;top:-18px;left:16px;background:var(--navy);color:#fff;font-family:var(--title);padding:4px 14px;border-radius:999px;font-size:16px}
.cut .text{font-size:clamp(17px,4.2vw,22px);line-height:1.5;margin-top:6px}
.cut .nav{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;opacity:.6}
.skip{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.35);color:#fff!important;padding:6px 12px;border-radius:999px;font-size:14px;z-index:3}

/* battle */
.battle{display:flex;flex-direction:column;height:100%;padding:4px 8px 6px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:6px;height:30px}
.pill{font-family:var(--title);background:rgba(255,255,255,.85);padding:3px 11px;border-radius:999px;font-size:14px;white-space:nowrap}
.badges{display:flex;gap:2px;font-size:16px}
.badges span{background:linear-gradient(#fff3c4,#ffd76a);border:2px solid #b8860b;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px}
.pols{display:flex;gap:2px}
.pol-ico{background:#fff;border:2px solid var(--ink);border-radius:8px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
.icon-btn{background:rgba(255,255,255,.85);border-radius:999px;width:34px;height:28px;font-size:15px;flex:none}
.ticker{height:22px;display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:8px;padding:0 8px;font-size:13px;overflow:hidden;margin-top:3px}
.ticker b{font-family:var(--title);font-weight:normal;background:#e8473b;padding:0 7px;border-radius:5px;flex:none}
.ticker span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker span.new{animation:tickIn .45s ease}
.arena{flex:1;display:flex;align-items:stretch;justify-content:space-between;position:relative;border:3px solid var(--ink);border-radius:18px;background:rgba(255,255,255,.32);margin:10px 0 6px;padding:10px 8px 6px;min-height:200px}
.arena .loc{position:absolute;top:-12px;left:12px;background:var(--navy);color:#fff;font-size:12px;padding:1px 10px;border-radius:7px;font-family:var(--title);white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis}
.arena .scene{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:space-around;font-size:clamp(28px,6vw,48px);opacity:.14;pointer-events:none}
.side{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;position:relative;min-width:0}
.vs{align-self:center;font-family:var(--title);font-size:clamp(20px,5vw,30px);color:var(--foe);text-shadow:0 2px 0 #fff;padding:0 2px}
.plate{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 9px 6px;width:100%;max-width:250px;box-shadow:0 4px 0 var(--ink);position:relative}
.plate .pn{font-family:var(--title);font-size:clamp(14px,3.4vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .pn small{font-size:12px;opacity:.75}
.plate .pf{font-size:11px;opacity:.8;margin:1px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:14px;border-radius:8px;background:#e9e1d1;border:2px solid var(--ink);position:relative;overflow:hidden;margin-top:2px}
.bar i{position:absolute;inset:0 auto 0 0;transition:width .5s cubic-bezier(.2,1.2,.4,1);background:#3fbf74}
.bar.mid i{background:#f2b632}.bar.low i{background:#e0453b}
.bar b{position:relative;display:block;text-align:center;font-size:11px;line-height:10px;font-family:var(--title);font-weight:normal}
.bar.xp{height:13px;margin-top:3px}.bar.xp i{background:linear-gradient(90deg,#7fb4ff,#2f6fd0)}.bar.xp b{font-size:10px;line-height:9px;color:#fff;text-shadow:0 1px 1px #000}
.boss-tag{position:absolute;top:-11px;right:8px;background:var(--foe);color:#fff;font-size:11px;font-family:var(--title);padding:0 8px;border-radius:999px}
.rage-tag{background:#8a1010;animation:throb .8s infinite}
.sprite{position:relative;font-size:clamp(62px,14vh,124px);line-height:1;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25));animation:idle 2.4s ease-in-out infinite;margin-top:6px;transition:transform .18s}
.sprite i{position:absolute;right:-18%;bottom:-4%;font-size:.48em;font-style:normal}
.sprite.s2{filter:drop-shadow(0 0 10px #ffd76a) drop-shadow(0 8px 6px rgba(0,0,0,.25))}
.sprite.s3{filter:drop-shadow(0 0 10px #9ee7ff) drop-shadow(0 0 18px #ff9de2) drop-shadow(0 8px 6px rgba(0,0,0,.25))}
.sprite.boss{font-size:clamp(76px,17vh,150px)}
.sprite.charging{filter:drop-shadow(0 0 16px #ffe14d) drop-shadow(0 0 30px #ffe14d);animation:throb .5s infinite}
.sprite.enter{animation:sendout .5s cubic-bezier(.2,1.4,.4,1)}
.sprite.faint{transition:transform .6s, opacity .6s;transform:translateY(40px) scale(.6)!important;opacity:0}
.sprite.hit{animation:hitflash .35s}
.sprite.frozen:after{content:"❄️";position:absolute;left:-14%;top:-10%;font-size:.4em}
.shadow{width:58%;height:12px;border-radius:50%;background:rgba(0,0,0,.16)}
.fc{background:#fff;border:2px dashed var(--foe);border-radius:10px;font-size:12px;padding:2px 8px;line-height:1.35;text-align:center;max-width:250px;width:100%}
.fc b{font-family:var(--title);font-weight:normal;color:var(--foe)}
.ai{background:#eaf2ff;border:2px solid var(--spell);border-radius:10px;font-size:12px;padding:2px 8px;line-height:1.35;text-align:center;max-width:250px;width:100%}
.status{font-size:11px;font-family:var(--title);display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:15px}
.status span{background:#fff;border:1px solid var(--ink);border-radius:999px;padding:0 6px}
.msgbox{background:var(--navy);color:#fff;border-radius:14px;padding:8px 12px;font-size:clamp(14px,3.6vw,17px);min-height:44px;display:flex;align-items:center;gap:8px;border:3px solid #0c1a38}
.msgbox .spk{font-size:20px}
#msg{line-height:1.35}
.cmd{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.mv{background:#fff;border:3px solid var(--ink);border-left:10px solid var(--fc,#999);border-radius:14px;padding:5px 8px;text-align:left;box-shadow:0 3px 0 var(--ink);position:relative;min-height:46px;transition:transform .1s}
.mv:hover:not(:disabled){transform:translateY(-2px)}
.mv .t{font-family:var(--title);font-size:clamp(14px,3.4vw,17px);display:block}
.mv .s{font-size:11px;opacity:.75}
.mv .tag{position:absolute;right:6px;top:4px;font-family:var(--title);font-size:11px;background:var(--gold);color:#4a2a00;border-radius:999px;padding:0 6px}
.mv.good{background:linear-gradient(#fffbe6,#ffefb0)}
.mv:disabled{opacity:.42;cursor:default}
.sub{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.sub button{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.sub button:disabled{opacity:.42}
.party{display:flex;gap:5px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.pm{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:1px 5px 4px;font-size:20px;position:relative;line-height:1.1}
.pm small{font-size:10px;position:absolute;right:1px;top:-2px}
.pm i{position:absolute;left:3px;right:3px;bottom:1px;height:3px;border-radius:2px;background:#e9e1d1;overflow:hidden}
.pm i u{display:block;height:100%;background:#3fbf74}
.pm.on{box-shadow:0 0 0 3px var(--gold)}
.pm.down{filter:grayscale(1);opacity:.45}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--title);font-size:34px;-webkit-text-stroke:2px var(--ink);animation:floatup 1s ease forwards;white-space:nowrap}
.float.dmg{color:#ff4a4a}.float.big{font-size:56px}.float.heal{color:#4be38a}.float.buff{color:#ffd400}.float.info{color:#fff;font-size:22px}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--navy);color:#fff;font-family:var(--title);font-size:clamp(18px,4.4vw,30px);padding:10px 26px;border-radius:999px;border:3px solid #fff;animation:bannerpop 1.6s ease forwards;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.banner.gold{background:linear-gradient(90deg,#c48a12,#f2b632);color:#3a2200}
.banner.grow{background:linear-gradient(90deg,#2f9b58,#3fbf74)}
.banner.bad{background:linear-gradient(90deg,#b0302a,#e0603d)}
.bigseal{position:absolute;left:50%;top:44%;width:min(300px,64vw);aspect-ratio:1;border-radius:50%;border:10px double #d62d2d;color:#d62d2d;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--title);font-size:clamp(32px,8vw,52px);background:rgba(255,248,240,.9);animation:bigseal 1.6s ease forwards;transform:translate(-50%,-50%) rotate(-12deg);line-height:1.1;text-align:center}
.bigseal small{font-size:.36em;margin-top:6px}
.particle{position:absolute;font-size:24px;animation:fly .8s ease-out forwards}
.shake-s{animation:shk .25s}.shake-m{animation:shk2 .35s}.shake-l{animation:shk3 .5s}
#toast{position:fixed;left:50%;top:34%;transform:translateX(-50%);background:rgba(25,22,45,.93);color:#fff;font-family:var(--title);padding:10px 18px;border-radius:14px;z-index:90;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#tip{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(540px,92vw);background:#fffbe6;border:3px solid var(--ink);border-radius:16px;padding:8px 12px 8px 56px;font-size:15px;line-height:1.4;z-index:85;box-shadow:0 6px 0 var(--ink);display:none;cursor:pointer}
#tip.on{display:block;animation:rise .25s ease}
.inbattle #tip{bottom:auto;top:62px}
#tip .face{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:34px}
#tip b{font-family:var(--title);font-weight:normal;color:#b3261e}
#overlay{position:fixed;inset:0;background:rgba(15,12,35,.74);z-index:80;display:none;align-items:center;justify-content:center;padding:14px}
#overlay.on{display:flex}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:22px;padding:16px;width:min(540px,100%);max-height:94vh;overflow:auto;text-align:center;box-shadow:0 8px 0 var(--ink);animation:pop .35s ease;position:relative}
.panel h2{font-family:var(--title);font-weight:normal;font-size:clamp(22px,6vw,30px);margin:2px 0 6px}
.panel p{font-size:15px;line-height:1.5;margin:6px 0}
.list{display:flex;flex-direction:column;gap:6px;margin:8px 0;text-align:left}
.li{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.li:hover{background:#fffbe6}
.li.dis{opacity:.4;cursor:default}
.li .ic{font-size:30px;position:relative}
.li .ic i{position:absolute;right:-8px;bottom:-4px;font-size:.5em;font-style:normal}
.li .tx{flex:1;font-size:13px;line-height:1.35}
.li .tx b{font-family:var(--title);font-weight:normal;font-size:16px}
.li .ct{font-family:var(--title);font-size:18px}
.doc{background:#fff;border:2px solid #333;border-radius:4px;text-align:left;padding:14px 16px;font-size:15px;line-height:1.6;position:relative;box-shadow:4px 4px 0 rgba(0,0,0,.15)}
.doc h3{text-align:center;font-family:var(--title);font-weight:normal;font-size:21px;margin:0 0 8px;letter-spacing:5px;border-bottom:2px solid #333;padding-bottom:6px}
.doc table{width:100%;border-collapse:collapse}
.doc td{border:1px solid #999;padding:4px 8px;font-size:14px}
.doc td:first-child{background:#f1f3f7;width:28%;font-family:var(--title)}
.doc .seal{position:absolute;right:14px;bottom:8px;width:74px;height:74px;border-radius:50%;border:4px double #d62d2d;color:#d62d2d;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--title);font-size:14px;line-height:1.05;transform:rotate(-14deg);opacity:0;background:rgba(255,255,255,.65)}
.doc .seal.on{animation:stampin .45s ease forwards}
.evo{font-size:clamp(90px,24vh,170px);position:relative;display:inline-block;margin:10px 0}
.evo i{position:absolute;right:-16%;bottom:-4%;font-size:.48em;font-style:normal}
.evo.flash{animation:evoflash .25s steps(2) infinite}
.street{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0}
.bld{width:96px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 4px;font-size:12px;position:relative;color:var(--ink)}
.bld .b1{font-size:30px;line-height:1.1}.bld .b2{font-size:22px}
.cert{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.cert span{background:linear-gradient(#fffbe8,#ffe9a0);border:2px solid #a8740a;border-radius:12px;padding:6px 10px;font-family:var(--title);font-size:13px;color:var(--ink)}

/* choose screens */
.choose{height:100%;display:flex;flex-direction:column;padding:12px 10px;overflow:auto}
.choose h2{font-family:var(--title);font-weight:normal;text-align:center;margin:4px 0 2px;font-size:clamp(22px,5.2vw,30px)}
.choose .lead{text-align:center;font-size:15px;margin-bottom:10px;line-height:1.5}
.choose.dark{color:#fff}
.opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:stretch}
.pitch{flex:1 1 220px;max-width:290px;background:rgba(255,255,255,.94);border:3px solid var(--ink);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
.pitch .sp{font-size:56px;position:relative;line-height:1;animation:idle 2.2s ease-in-out infinite}
.pitch .sp i{position:absolute;right:-16%;bottom:-4%;font-size:.48em;font-style:normal}
.pitch .nm{font-family:var(--title);font-size:18px}
.pitch .bubble{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px 10px;font-size:14px;line-height:1.4;min-height:54px}
.pitch .mvs{width:100%;font-size:12px;background:#f4f6fb;border-radius:10px;padding:5px 8px;line-height:1.5}
.pitch .score{width:100%;font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:1px 8px;background:#f4f6fb;border-radius:10px;padding:5px 8px}
.pitch .score b{font-family:var(--title);font-weight:normal}
.pitch .honest{background:#fff6c9;border:2px dashed #c89400;border-radius:12px;padding:6px 8px;font-size:13px;line-height:1.35;width:100%}
.pitch .honest.bad{background:#ffe0dc;border-color:#d43c3c;color:#9b1c14}
.pitch .btns{display:flex;gap:6px;margin-top:auto;width:100%}
.pitch .btns button{flex:1;padding:9px 6px;border-radius:12px;font-size:15px}
.btn-eye{background:#fff;border:2px solid var(--ink)!important}
.btn-pick{background:linear-gradient(#7fe0a5,#2f9b58);color:#fff!important;box-shadow:0 3px 0 #155c33}
.alt-row{text-align:center;margin:12px 0 4px}
.alt-btn{background:#eaf2ff;border:2px solid var(--spell)!important;color:var(--spell)!important;border-radius:999px;padding:8px 18px;font-size:15px}
.polcard{flex:1 1 200px;max-width:250px;background:linear-gradient(#fffbe8,#ffeeb3);border:3px solid #a8740a;border-radius:18px;padding:16px 12px 12px;cursor:pointer;color:var(--ink);text-align:center;transition:transform .15s;position:relative}
.polcard:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.polcard .pi{font-size:44px}
.polcard h3{font-family:var(--title);font-weight:normal;margin:4px 0;font-size:19px}
.polcard .pd{font-size:15px;line-height:1.4;min-height:44px}
.polcard .pr{font-size:12px;opacity:.75;margin-top:8px;border-top:1px dashed #a8740a;padding-top:6px}
.polcard .no{position:absolute;top:5px;left:10px;font-size:10px;opacity:.6}
.stampmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-14deg);border:4px double #d62d2d;color:#d62d2d;font-family:var(--title);font-size:22px;padding:4px 12px;border-radius:10px;background:rgba(255,255,255,.85);animation:stamp .7s ease forwards;white-space:nowrap;z-index:5}

/* ending */

    <h2>연말 조달 실적 보고서</h2>
    <div style="opacity:.8">혁신조달 평가 등급</div><div class="grade">${grade}</div><br>
    <div class="type">${type[0]} ${type[1]}${G.caught ? ' + 🕵️ 가짜 AI 사냥꾼' : ''}</div>
    <p>${type[2]}</p>
    <p style="font-family:var(--title);margin-top:12px">🏘️ 내가 키운 동료들</p>${streetHTML()}
    <div class="cert">${G.badges.map(b => `<span>🏅 ${b.org} 감사장</span>`).join('')}</div>
    <div class="report">${rep.map(r => `<div>${r}</div>`).join('')}</div>
    <div class="report">💡 진짜 조달청은 새 기술의 <b>첫 손님</b>이 되어요. 나라 돈으로 먼저 사서 필요한 공공기관이 써보게 해요. (2026년 혁신제품 시범구매 <b>839억 원</b>, AI 분야 전용트랙 신설)</div>
    <div class="report" style="text-align:center;font-family:var(--title);font-size:20px">처음은, 나라가 믿어줄게요. — 조달청</div>
    <div class="row-btns"><button class="big-btn" data-act="share">결과 복사 📋</button><button class="ghost-btn" data-act="toTitle">처음부터 🔁</button></div>
  </div></div>`;
  sfx('win'); burst($('.grade'), ['🎉', '✨', '⭐'], 20);
}

/* ---------- 입력 ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, n = +el.dataset.i;
  switch (a) {
    case 'sound': G.sound = !G.sound; if (B && !B.over) renderBattle(); else if (!B) titleScreen(); return;
    case 'start': sfx('go'); startGame(); return;
    case 'cutNext': cutNext(); return;
    case 'cutSkip': e.stopPropagation(); cutSkip(); return;
    case 'reqOk': reqOk(); return;
    case 'retry': closeOverlay(); G.team.forEach(t => t.hp = maxHp(t)); G.bag.letter++; startFight(B.fight, false); return;
    case 'afterSeason': afterSeason(); return;
    case 'polPick': polPick(el.dataset.id, el); return;
    case 'mEye': marketEye(el.dataset.id); return;
    case 'mPick': marketPick(el.dataset.id); return;
    case 'ctOk': contractOk(); return;
    case 'mFeedback': if (M && !M.done) feedbackScreen(); return;
    case 'fbPick': fbPick(n); return;
    case 'evoOk': if (G._evoRes) { const r = G._evoRes; G._evoRes = null; r(); } return;
    case 'closeOv': closeOverlay(); return;
    case 'toTitle': titleScreen(); return;
    case 'pol': { const P = POLICIES[el.dataset.id]; toast(`${P.i} ${P.n}: ${P.d}`, 2200); return; }
    case 'share': try { await navigator.clipboard.writeText(G.shareText); toast('결과를 복사했어요! 붙여넣어 자랑해요 📋'); } catch (err) { prompt('아래 글을 복사하세요', G.shareText); } return;
    case 'move': act({ type: 'move', i: n }); return;
    case 'bag': openBag(); return;
    case 'bagPick': bagPick(el.dataset.k); return;
    case 'itemUse': act({ type: 'item', k: el.dataset.k, t: n }); return;
    case 'switch': if (B && !B.busy && !B.over) openSwitch(false); return;
    case 'swPick': act({ type: 'switch', idx: n }); return;
    case 'forcePick': if (forceRes) { closeOverlay(); const r = forceRes; forceRes = null; await doSwitch(n); r(); } return;
  }
});
titleScreen();
</script>
</body>
</html>
