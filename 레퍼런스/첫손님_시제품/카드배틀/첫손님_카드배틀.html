<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>첫 손님 카드 배틀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#232042; --paper:#fffaf0; --line:#e2d3b3;
  --new:#2f9b58; --old:#6b7a99; --spell:#2f6fd0; --foe:#d2502e; --gold:#f2b632; --navy:#1f3a6e;
  --hw:clamp(60px,min(13vw,13.5vh),100px); --bw:clamp(54px,min(12.5vw,12.5vh),90px);
  --title:'Jua','Gowun Dodum',system-ui,sans-serif; --body:'Gowun Dodum','Jua',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#15122a;color:var(--ink);font-family:var(--body);user-select:none;-webkit-user-select:none}
button{font-family:var(--title);cursor:pointer;border:none;color:inherit}
#app{position:fixed;inset:0;display:flex;justify-content:center}
.screen{width:100%;max-width:1000px;height:100%;position:relative;overflow:hidden}
.bg-spring{background:linear-gradient(180deg,#ffd6e2 0%,#fff1d6 42%,#d4efc4 100%)}
.bg-summer{background:linear-gradient(180deg,#9fc0ea 0%,#d6ebf7 42%,#b8e0d4 100%)}
.bg-autumn{background:linear-gradient(180deg,#ffcf9c 0%,#ffefd6 42%,#f0cfae 100%)}
.bg-winter{background:linear-gradient(180deg,#c8dcf6 0%,#f2f7ff 42%,#d9e4f4 100%)}
.bg-office{background:radial-gradient(circle at 50% 20%,#2f4f8f 0%,#1a2b52 55%,#111a33 100%)}
.bg-title{background:radial-gradient(circle at 50% 28%,#3e5fa8 0%,#1d2c57 55%,#0f1530 100%)}
.scenery{position:absolute;left:0;right:0;pointer-events:none;font-size:min(9vw,80px);display:flex;justify-content:space-around;filter:saturate(.6);top:13%;opacity:.12}

/* ===== title ===== */
.title-wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;padding:16px;position:relative}
.badge-top{font-family:var(--title);background:#fff;color:var(--navy);border-radius:999px;padding:4px 14px;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.title-fan{position:relative;height:clamp(130px,24vh,190px);width:300px;margin-bottom:4px}
.title-fan .card{position:absolute;left:50%;top:6px;transform-origin:50% 130%;--hw:clamp(80px,12vh,104px);animation:fanIn .6s ease backwards}
.title-wrap h1{font-family:var(--title);font-size:clamp(50px,12vw,92px);margin:0;letter-spacing:3px;color:#ffe9a8;text-shadow:0 5px 0 #b8701f,0 10px 26px rgba(0,0,0,.5);font-weight:normal}
.title-wrap .sub{font-size:clamp(15px,3.6vw,20px);opacity:.92}
.title-wrap .copy{font-family:var(--title);font-size:clamp(18px,4.4vw,26px);color:#bff3d2}
.big-btn{font-size:22px;padding:14px 40px;border-radius:999px;background:linear-gradient(#ffd25e,#f2a52b);color:#4a2a00!important;box-shadow:0 5px 0 #b86b1f,0 10px 24px rgba(0,0,0,.35);transition:transform .1s}
.big-btn:hover{transform:translateY(-2px) scale(1.03)}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b86b1f}
.ghost-btn{background:rgba(255,255,255,.12);color:#fff!important;border:2px solid rgba(255,255,255,.8);border-radius:999px;padding:8px 20px;font-size:15px}
.small-note{font-size:12px;opacity:.55;margin-top:6px;max-width:560px}

/* ===== cut ===== */
.cut{height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;position:relative;cursor:pointer}
.cut .speaker{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(90px,22vh,170px);filter:drop-shadow(0 10px 14px rgba(0,0,0,.25));animation:popc .35s ease}
.cut .prop{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-family:var(--title);font-size:17px;background:rgba(255,255,255,.88);padding:6px 16px;border-radius:999px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.cut .box{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:16px 18px 12px;box-shadow:0 6px 0 var(--ink);position:relative;min-height:110px;animation:rise .25s ease;max-width:820px;margin:0 auto;width:100%}
.cut .name{position:absolute;top:-18px;left:16px;background:var(--navy);color:#fff;font-family:var(--title);padding:4px 14px;border-radius:999px;font-size:16px}
.cut .text{font-size:clamp(17px,4.2vw,22px);line-height:1.5;margin-top:6px}
.cut .nav{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;opacity:.6}
.skip{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.35);color:#fff!important;padding:6px 12px;border-radius:999px;font-size:14px;z-index:3}

/* ===== battle ===== */
.battle{display:flex;flex-direction:column;height:100%;padding:4px 8px 2px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:6px;height:30px;position:relative;z-index:2}
.pill{font-family:var(--title);background:rgba(255,255,255,.8);padding:3px 11px;border-radius:999px;font-size:14px;white-space:nowrap}
.pols{display:flex;gap:3px;overflow:hidden}
.pol-ico{background:linear-gradient(#fff3c4,#ffd76a);border:2px solid #b8860b;border-radius:8px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer}
.icon-btn{background:rgba(255,255,255,.8);border-radius:999px;width:34px;height:28px;font-size:15px;flex:none}
.ticker{height:22px;display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:8px;padding:0 8px;font-size:13px;overflow:hidden;position:relative;z-index:2;margin-top:2px}
.ticker b{font-family:var(--title);background:#e8473b;padding:0 7px;border-radius:5px;flex:none;font-weight:normal}
.ticker span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker span.new{animation:tickIn .45s ease}
.bossrow{display:flex;justify-content:center;align-items:center;gap:8px;height:clamp(58px,10vh,78px);position:relative;z-index:2}
.portrait{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border:3px solid var(--ink);border-radius:16px;padding:3px 10px 3px 6px;position:relative;transition:box-shadow .15s}
.portrait .p-art{font-size:clamp(32px,6.5vh,50px);line-height:1}
.portrait .p-name{font-family:var(--title);font-size:14px;white-space:nowrap}
.portrait .hpbar{width:clamp(100px,22vw,170px);height:17px;border-radius:9px;background:#e9e1d1;overflow:hidden;position:relative;border:2px solid var(--ink);margin-top:2px}
.portrait .hpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#ff8a5b,#d2502e);transition:width .45s cubic-bezier(.2,1.4,.4,1)}
.portrait.hero .hpbar i{background:linear-gradient(90deg,#ff9fb0,#ff4d68)}
.portrait .hpbar b{position:relative;font-size:12px;display:block;text-align:center;line-height:13px;font-family:var(--title);font-weight:normal}
.portrait.enraged{background:#ffe1d8;border-color:#b3261e;animation:rage 1.2s infinite}
.portrait.targetable{box-shadow:0 0 0 4px #ff3b3b,0 0 22px #ff3b3b;cursor:crosshair;animation:throb 1s infinite}
.idcard{position:absolute;top:-9px;left:6px;background:var(--navy);color:#fff;font-size:9px;padding:0 6px;border-radius:5px;font-family:var(--title)}
.forecast{background:rgba(255,255,255,.92);border:2px dashed var(--foe);border-radius:12px;padding:3px 8px;font-size:12px;line-height:1.3;max-width:210px}
.forecast b{font-family:var(--title);color:var(--foe);font-weight:normal}
.board{flex:1;display:flex;justify-content:center;align-items:center;gap:clamp(5px,1.6vw,14px);min-height:calc(var(--bw)*1.3 + 18px);position:relative;z-index:2}
.board.foe{padding-top:14px}
.board .empty{font-family:var(--title);opacity:.25;font-size:17px}
.mid{height:22px;display:flex;align-items:center;justify-content:center;position:relative;z-index:2}
.mid:before{content:"";position:absolute;left:3%;right:3%;top:50%;border-top:2px dashed rgba(35,32,66,.25)}
.mid span{position:relative;background:var(--navy);color:#fff;font-family:var(--title);font-size:13px;padding:2px 12px;border-radius:999px}
.mid span.enemy{background:var(--foe)}
.mid span.combo{position:absolute;right:6%;background:linear-gradient(#ffe27a,#f2a52b);color:#4a2a00;border:2px solid var(--ink);animation:pop .3s ease}
.playerbar{display:flex;align-items:center;justify-content:space-between;gap:6px;height:clamp(52px,9vh,64px);position:relative;z-index:3}
.playerbar .portrait .p-art{font-size:clamp(28px,5.5vh,42px)}
.dmgwarn{position:absolute;right:-8px;top:-12px;background:var(--foe);color:#fff;font-family:var(--title);font-size:12px;border-radius:999px;padding:1px 7px;border:2px solid #fff;animation:throb 1s infinite}
.mana{display:flex;flex-direction:column;align-items:center;font-family:var(--title);font-size:12px;background:rgba(255,255,255,.85);border-radius:14px;padding:3px 8px}
.mana .pips{display:flex;gap:1px;font-size:clamp(12px,2.6vh,17px)}
.pip.off{filter:grayscale(1) opacity(.3)}
.pip.lock{opacity:.12;filter:grayscale(1)}
.eye-btn{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px 8px;font-size:14px;line-height:1.1}
.eye-btn small{display:block;font-size:10px;opacity:.7}
.eye-btn.used{opacity:.4}
.eye-btn.active{background:#fff1b8;box-shadow:0 0 0 3px var(--gold)}
.end-btn{background:linear-gradient(#ffd25e,#f2a52b);color:#4a2a00!important;border-radius:14px;padding:6px 12px;font-size:15px;line-height:1.1;box-shadow:0 4px 0 #b86b1f}
.end-btn small{display:block;font-size:10px;opacity:.75}
.end-btn:disabled{background:#ccc;box-shadow:0 4px 0 #999;color:#777!important}
.end-btn.pulse{animation:throb 1s infinite;box-shadow:0 4px 0 #b86b1f,0 0 0 4px #fff,0 0 18px #ffd25e}
.hand{display:flex;justify-content:center;align-items:flex-end;gap:clamp(2px,.8vw,8px);height:calc(var(--hw)*1.42 + 24px);padding-bottom:12px;position:relative;z-index:4}

/* ===== card ===== */
.card{--rx:0deg;--ry:0deg;--ty:0px;--sc:1;width:var(--hw);height:calc(var(--hw)*1.42);border-radius:11px;background:var(--paper);border:3px solid var(--ink);position:relative;flex:none;font-family:var(--title);cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,.22);transform:perspective(600px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--ty)) scale(var(--sc));transition:transform .14s, box-shadow .14s}
.card .hd{position:absolute;left:0;right:0;top:0;height:13%;border-radius:8px 8px 0 0;font-size:calc(var(--hw)*0.088);color:#fff;display:flex;align-items:center;justify-content:center;letter-spacing:.5px;white-space:nowrap;overflow:hidden}
.card .art{position:absolute;left:5%;right:5%;top:15%;height:36%;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.card .art .a1{font-size:calc(var(--hw)*0.36);line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));animation:bob 3s ease-in-out infinite}
.card .art .a2{font-size:calc(var(--hw)*0.2);position:absolute;right:6%;bottom:4%}
.card .nm{position:absolute;left:2px;right:2px;top:53%;text-align:center;font-size:calc(var(--hw)*0.118);line-height:1.08;word-break:keep-all}
.card .who{position:absolute;left:2px;right:2px;top:69%;text-align:center;font-size:calc(var(--hw)*0.088);opacity:.62;font-family:var(--body);line-height:1.1;padding:0 3px}
.card .ft{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:center;align-items:center;gap:2px;font-size:calc(var(--hw)*0.12);letter-spacing:-1px}
.card .field{border-radius:6px;padding:0 2px;opacity:.55}
.card .field.on{opacity:1;background:#fff1a8;box-shadow:0 0 0 2px #f2b632;animation:throb 1.2s infinite}
.card .cost{position:absolute;left:-9px;top:-9px;width:calc(var(--hw)*0.3);height:calc(var(--hw)*0.3);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff0a8,#f2a52b 70%,#c47a12);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:calc(var(--hw)*0.17);z-index:3;color:#4a2a00}
.card .cost.cheap{background:radial-gradient(circle at 35% 30%,#d4ffe1,#3fae6b 70%,#1e6b3e);color:#fff}
.card .atk,.card .hp{position:absolute;bottom:-10px;width:calc(var(--hw)*0.31);height:calc(var(--hw)*0.31);display:flex;align-items:center;justify-content:center;font-size:calc(var(--hw)*0.17);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.5);z-index:3}
.card .atk{left:-8px;border-radius:50%;border:2px solid var(--ink);background:radial-gradient(circle at 35% 30%,#ffc07a,#e0603d 70%,#a8381c)}
.card .atk.q{background:radial-gradient(circle at 35% 30%,#e2d2ff,#7b5cd6 70%,#4c3399)}
.card .atk.up{background:radial-gradient(circle at 35% 30%,#fff4a8,#f2b632 70%,#b8860b);color:#4a2a00;text-shadow:none}
.card .hp{right:-8px;border:2px solid var(--ink);border-radius:6px 6px 50% 50%;background:linear-gradient(#7fe0a5,#2f9b58)}
.card .hp.hurt{background:linear-gradient(#ffb0b0,#d43c3c)}
.card .stg{position:absolute;right:-9px;top:-10px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:0 4px;font-size:calc(var(--hw)*0.15);z-index:3;line-height:1.25;text-align:center}
.card .stg i{display:block;font-style:normal;font-size:7px;letter-spacing:0;line-height:8px;padding-bottom:2px;color:var(--new)}
.card .tag{position:absolute;left:50%;transform:translateX(-50%);bottom:-13px;background:var(--spell);color:#fff;font-size:10px;padding:0 6px;border-radius:999px;white-space:nowrap;z-index:4}
.t-new{border-color:#155c33}.t-new .hd{background:linear-gradient(90deg,#2f9b58,#3fbf74)}.t-new .art{background:radial-gradient(circle at 50% 40%,#effff4,#9be0b5)}
.t-old{background:#f3f5f9;border-color:#3b4660}.t-old .hd{background:linear-gradient(90deg,#55627f,#7d8aa8)}.t-old .art{background:radial-gradient(circle at 50% 40%,#fff,#c9d0de)}
.t-spell{background:#eaf2ff;border-color:#163f80}.t-spell .hd{background:linear-gradient(90deg,#2f6fd0,#4f8ef0)}.t-spell .art{background:radial-gradient(circle at 50% 40%,#fff,#a9c6f5)}
.t-spell .who{top:68%;opacity:.85}
.t-enemy{background:#fff3ec;border-color:#7d2410}.t-enemy .hd{background:linear-gradient(90deg,#c43d1b,#e8673f)}.t-enemy .art{background:radial-gradient(circle at 50% 40%,#fff,#ffb196)}
.t-fake{border-color:#155c33}.t-fake .hd{background:linear-gradient(90deg,#ff5fb8,#ffc23f,#4fd4ff,#ff5fb8);background-size:300% 100%;animation:shimmer 2s linear infinite}
.t-fake .art{background:linear-gradient(135deg,#fff3a8,#ffcf3f,#ff9de2,#9ee7ff);background-size:300% 300%;animation:shimmer 2.4s linear infinite}
.card.gold{border-color:#a8740a;box-shadow:0 0 0 2px #ffd76a,0 4px 10px rgba(0,0,0,.25)}
.card.gold .hd{background:linear-gradient(90deg,#c48a12,#ffd76a,#c48a12);background-size:200% 100%;animation:shimmer 3s linear infinite;color:#4a2a00}
.card.holo .art{background:linear-gradient(135deg,#ffd6f5,#d6f0ff,#d9ffd6,#fff3c4,#ffd6f5);background-size:400% 400%;animation:shimmer 4s linear infinite}
.card.holo{box-shadow:0 0 0 2px #fff,0 0 14px #9ee7ff,0 0 26px #ff9de2}

.hand .card:hover{--ty:-12px;--sc:1.06;z-index:6}
.hand .card.playable{box-shadow:0 0 0 3px #4be38a,0 0 14px rgba(75,227,138,.8),0 4px 10px rgba(0,0,0,.25)}
.hand .card.sel{--ty:-26px;--sc:1.12;z-index:7;box-shadow:0 0 0 4px var(--gold),0 12px 26px rgba(0,0,0,.4)}
.hand .card.eye-pick{box-shadow:0 0 0 4px #ffd400;animation:throb 1s infinite}
.hand .card.drawn{animation:drawIn .45s cubic-bezier(.2,1.4,.4,1)}

.board .card{width:var(--bw);height:calc(var(--bw)*1.3);--hw:var(--bw)}
.board .card .who{display:none}
.board .card .nm{top:54%}
.board .card .ft{bottom:13%}
.board .card.guard{border-width:4px;border-style:double;border-radius:14px 14px 24px 24px;box-shadow:0 0 0 3px rgba(60,110,210,.55),0 4px 8px rgba(0,0,0,.2)}
.board .card.ready{box-shadow:0 0 0 3px #4be38a,0 0 18px #4be38a;--ty:-3px}
.board .card.attacker{--ty:-12px;--sc:1.08;box-shadow:0 0 0 4px var(--gold),0 0 24px var(--gold);z-index:5}
.board .card.targetable{box-shadow:0 0 0 4px #ff3b3b,0 0 20px #ff3b3b;animation:throb 1s infinite;cursor:crosshair}
.board .card.friend-target{box-shadow:0 0 0 4px var(--spell),0 0 20px var(--spell);animation:throb 1s infinite}
.board .card.frozen:before{content:"❄️";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bw)*.5);background:rgba(170,210,255,.6);border-radius:8px;z-index:5}
.board .card.sleepy .art:after{content:"💤";position:absolute;left:3px;top:1px;font-size:calc(var(--bw)*0.18)}
.intent{position:absolute;top:-20px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--foe);color:var(--foe);font-size:12px;border-radius:999px;padding:0 7px;white-space:nowrap;z-index:4;font-family:var(--title)}
.intent.v{background:var(--foe);color:#fff}
.card.dying{transition:transform .32s, opacity .32s;transform:scale(.15) rotate(25deg)!important;opacity:0}
.card.enter{animation:slam .38s cubic-bezier(.2,1.4,.4,1)}
.card.lunging{transition:transform .16s ease-in!important;z-index:30}

#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--title);font-size:32px;-webkit-text-stroke:2px var(--ink);animation:floatup 1s ease forwards;white-space:nowrap}
.float.dmg{color:#ff4a4a}.float.big{font-size:52px}.float.heal{color:#4be38a}.float.buff{color:#ffd400}.float.info{color:#fff;font-size:22px}
.banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:var(--navy);color:#fff;font-family:var(--title);font-size:clamp(18px,4.4vw,30px);padding:10px 26px;border-radius:999px;border:3px solid #fff;animation:bannerpop 1.7s ease forwards;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.banner.grow{background:linear-gradient(90deg,#2f9b58,#3fbf74)}
.banner.gold{background:linear-gradient(90deg,#c48a12,#f2b632);color:#3a2200}
.banner.bad{background:linear-gradient(90deg,#b0302a,#e0603d)}
.stamp{position:absolute;left:50%;top:50%;width:118%;transform:translate(-50%,-50%) rotate(-14deg);border:4px double #d62d2d;color:#d62d2d;font-family:var(--title);font-size:calc(var(--bw)*0.19);text-align:center;border-radius:10px;background:rgba(255,255,255,.82);z-index:8;animation:stamp .6s ease forwards;pointer-events:none;padding:2px 0;white-space:nowrap}
.bigseal{position:absolute;left:50%;top:46%;width:min(300px,64vw);aspect-ratio:1;border-radius:50%;border:10px double #d62d2d;color:#d62d2d;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--title);font-size:clamp(32px,8vw,52px);background:rgba(255,248,240,.9);animation:bigseal 1.6s ease forwards;transform:translate(-50%,-50%) rotate(-12deg);line-height:1.1;text-align:center}
.bigseal small{font-size:.38em;margin-top:6px}
.particle{position:absolute;font-size:22px;animation:fly .8s ease-out forwards}
.shake-s{animation:shk .25s}.shake-m{animation:shk2 .35s}.shake-l{animation:shk3 .5s}
#toast{position:fixed;left:50%;top:36%;transform:translateX(-50%);background:rgba(25,22,45,.93);color:#fff;font-family:var(--title);padding:10px 18px;border-radius:14px;z-index:70;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#say{position:fixed;left:50%;top:clamp(120px,19vh,150px);transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 14px;font-family:var(--title);font-size:16px;z-index:55;opacity:0;transition:opacity .2s;pointer-events:none;max-width:86vw;text-align:center}
#say:before{content:"";position:absolute;top:-12px;left:50%;margin-left:-8px;border:8px solid transparent;border-bottom-color:var(--ink);border-top:0}
#say.on{opacity:1}

  const kwStr = c.type === 'fake' ? '✨✨' : [...c.kw].map(k => KW[k].i).join('');

async function tryPlay(c) {
  if (B.turn !== 'player' || B.busy) return;
  const cost = effCost(c);
  if (cost > B.mana) { toast('예산이 모자라요 💰'); shakeEl(elOf(c)); return; }
  if (c.type === 'spell') {

    }

  B.mana -= cost; B.hand = B.hand.filter(x => x !== c); B.sel = null;
  if (c.type === 'new' || c.type === 'fake') { B.discount = 0; B.priorityUsed = true; }

  if (c.baseAtk == null) { c.baseAtk = rnd(c.t.atk[0], c.t.atk[1]); revealed = true; }
  c.canAttack = c.kw.has('rush'); c.justPlayed = true; c.enter = true; c.frozenNow = false;
  if (c.type === 'new' && hasP('aitrack')) c.bonusA += 1;
  B.board.push(c); B.combo++;
  sfx('play'); renderBattle(); await sleep(140);
  sfx('stamp'); screenShake(1); stampOn(elOf(c), c.type === 'old' ? '구매 결재' : '첫 손님 결재');
  if (c.type === 'new' && !G.firsts.has(c.id)) { G.firsts.add(c.id); news(`[속보] ${c.t.who} '${c.t.name}', 공공기관 첫 납품!`); }
  if (c.type === 'fake') news(`[광고] 무엇이든AI "AI가 다~ 해결합니다!"`);
  if (revealed) { await sleep(260); floatAt(elOf(c), `대응력 ${atkOf(c)}!`, 'buff'); burst(elOf(c), ['✨', '⭐'], 6); }
  if (fieldOn(c)) { await sleep(200); floatAt(elOf(c), `${FIELDS[c.t.field].i} 현장 맞춤!`, 'buff'); }
  if (c.type === 'new' && hasP('aitrack')) { await sleep(200); floatAt(elOf(c), '🤖 AI +1', 'buff'); }
  await sleep(320);
  await onPlayEffect(c);

  if (G.stage === 0) tip('t2', `<b>달이</b>: 판에 낸 카드는 💤 <b>다음 턴부터</b> 재난을 처리해요. 할 게 없으면 <b>[결재 ✒️]</b>로 턴을 끝내요!`);
  if (c.type === 'old') tip('old', `<b>달이</b>: 🏢 많이 쓰는 제품은 믿음직하지만 <b>자라지 않아요</b>. 🌱 새 기술은 쓸수록 자라요!`);

async function onPlayEffect(c) {

  }

}

async function gainXp(c) {

  c.xp += 1; if (c.ref && !c.isCopy) c.ref.xp = c.xp;
  renderBattle();

    if (c.stage >= 2) { sfx('gold'); banner(`★ ${c.t.art} ${STAGES[c.stage].icon} ${STAGES[c.stage].name}! 우수 혁신제품`, 'gold'); burst(el, ['⭐', '✨', '🏆'], 14); screenShake(3); }

    floatAt(el, '+1/+1', 'buff');

}

/* ----- 정리 ----- */
async function cleanup() {
  const deadE = B.eboard.filter(m => m.hp <= 0), deadP = B.board.filter(m => m.hp <= 0);
  if (!deadE.length && !deadP.length) return;
  deadE.forEach(m => burst(elOf(m), [m.t.art, '💥'], 7));
  [...deadE, ...deadP].forEach(m => { const el = elOf(m); el && el.classList.add('dying'); });
  sfx('die'); await sleep(330);
  B.eboard = B.eboard.filter(m => m.hp > 0); B.board = B.board.filter(m => m.hp > 0);
  for (const m of deadP) {
    if (m.type === 'new' && hasP('immunity')) { const d = drawCard(); renderBattle(); if (d) floatAt(elOf(d), '🛡️ 면책 +1장', 'buff'); }
    if (m.kw.has('retry') && !m.retried && m.type === 'new') {
      const nc = makeCard(m.ref || { id: m.id, stage: m.stage, temp: true });
      const plus = hasP('feedback') ? 2 : 1;
      nc.ref = m.ref; nc.baseAtk = (m.baseAtk ?? m.t.atk[1]); nc.bonusA = plus; nc.hp += plus; nc.maxHp += plus;
      nc.kw.delete('unknown'); nc.retried = true; nc.fixed = true; nc.xp = m.xp;
      if (B.hand.length < 6) {
        B.hand.push(nc); G.fixes++; renderBattle(); floatAt(elOf(nc), '🔁 고쳐서 다시!', 'buff'); sfx('heal');
        tip('retry', `<b>달이</b>: 사라졌지만 <b>고친 판</b>으로 손에 돌아왔어요! 실패해도 고칠 점을 알면 더 좋아져요.`);
      }
    }
  }
  renderBattle();
}

/* ----- 내 처리 ----- */
async function doAttack(att, tgt) {
  B.mode = null; B.attacker = null;
  if (!validTargets().includes(tgt)) { toast('🛡️ 지켜요 재난부터 처리해야 해요!'); renderBattle(); return; }
  B.busy = true; att.canAttack = false; showInfo(null); renderBattle();
  const tEl = tgt === 'boss' ? $('#boss') : elOf(tgt);
  await lunge(elOf(att), tEl);
  const a = atkOf(att);
  sfx(a >= 4 ? 'big' : 'hit'); screenShake(a);
  if (tgt === 'boss') {
    B.bossHp = Math.max(0, B.bossHp - a);
    floatAt($('#boss'), '-' + a, a >= 4 ? 'dmg big' : 'dmg'); burst($('#boss'), ['💥', '✨'], a >= 4 ? 10 : 5); renderBattle();
    if (Math.random() < .5) say(pick(S().say.hurt), 1200);
    await sleep(260);
    if (B.bossHp <= 0) { await winBattle(); return; }
    if (att.hp > 0) await gainXp(att);
    await rageCheck();
  } else {
    const ta = atkOf(tgt);
    tgt.hp -= a; att.hp -= ta;
    floatAt(elOf(tgt), '-' + a); if (ta > 0) floatAt(elOf(att), '-' + ta);
    renderBattle(); await sleep(260);
    const killed = tgt.hp <= 0;
    if (killed && att.hp > 0) await gainXp(att);
    if (killed && hasP('global') && att.type === 'new' && att.stage >= 2) {
      B.bossHp = Math.max(0, B.bossHp - 2); renderBattle(); floatAt($('#boss'), '-2 🌏'); shakeEl($('#boss'));
      await sleep(300); if (B.bossHp <= 0) { await cleanup(); await winBattle(); return; }
    }
    await cleanup();
    await rageCheck();
  }
  if (B.over) return;
  B.busy = false; renderBattle();
  if (B.turn === 'player' && noMovesLeft()) tip('endhint', `<b>달이</b>: 더 할 게 없으면 <b>[결재 ✒️]</b>로 턴을 끝내요!`);
}
async function rageCheck() {
  if (B.enraged || B.over || B.bossHp > B.bossMax / 2) return;
  B.enraged = true; const s = S();
  sfx('boss'); screenShake(5); banner(`😡 ${s.boss}가 화났다!`, 'bad'); say(s.say.rage, 2000);
  news(`[긴급] ${s.boss} 거세져… 현장 긴장`);
  renderBattle(); await sleep(800);
  for (const id of s.rage) { if (B.eboard.length >= 5) break; const e = makeCard({ id, temp: true }); e.enter = true; e.summonedNow = true; B.eboard.push(e); sfx('play'); renderBattle(); await sleep(300); }
  tip('rage', `<b>달이</b>: 재난 대장은 힘이 절반 아래로 떨어지면 <b>화가 나서</b> 재난을 더 불러요. 조금만 더!`);
}

/* ----- 안경 ----- */
async function useEye(c) {

/* ----- 턴 끝 ----- */
async function endTurn() {

/* ----- 재난 턴 ----- */
async function enemyTurn() {
  const s = S();
  B.turn = 'enemy'; renderBattle(); await sleep(450);
  for (const m of B.board.filter(m => m.type === 'fake' && !m.exposed)) {
    m.exposed = true; banner('바람에 커튼이 펄럭… 사람이 누르고 있었다!', 'bad'); sfx('fake'); await sleep(700);
    m.baseAtk = 0; m.bonusA = 0; m.hp = 1; m.maxHp = 1; m.kw.clear();
    B.village -= 3; G.fooled++; renderBattle(); floatAt(elOf(m), '앗…', 'info'); burst(elOf(m), ['🤚', '💦'], 6); floatAt($('#hero'), '-3'); shakeEl($('#hero')); screenShake(3);
    say('하하! 속았지~', 1500); news('[사회] 무엇이든AI "만능 거울", 알고 보니 사람이 손으로…');
    tip('fooled', `<b>달이</b>: 으앗, 겉만 AI였어요! 다음엔 <b>🥽 안경</b>으로 먼저 확인해요. 너무 좋아 보이면 의심!`, true);
    await sleep(800);
    if (B.village <= 0) { await loseBattle(); return; }
  }
  B.eTurn++;
  if (s.power === 'freeze' && B.eTurn >= 2) {
    const cand = B.board.filter(m => atkOf(m) > 0);
    if (cand.length) {
      const m = cand.sort((x, y) => atkOf(y) - atkOf(x))[0]; m.frozen = true;
      say('꽁꽁 얼어라~', 1400); sfx('freeze'); renderBattle(); floatAt(elOf(m), '❄️ 꽁꽁', 'info'); burst(elOf(m), ['❄️'], 6); await sleep(650);
      tip('freezeinfo', `<b>달이</b>: 한파 할멈이 가장 센 카드를 얼렸어요. 다음 턴에 한 번 쉬어요.`);
    }
  }
  const plays = B.eTurn <= s.script.length ? s.script[B.eTurn - 1] : s.loop[(B.eTurn - s.script.length - 1) % s.loop.length];
  for (const id of plays) { if (B.over) return; await enemyPlay(id); }
  if (B.over) return;
  for (const e of B.eboard.slice()) {
    if (B.over) return;
    if (!B.eboard.includes(e) || e.hp <= 0) continue;
    if (e.summonedNow && !e.kw.has('rush')) continue;
    if (atkOf(e) <= 0) continue;
    if (await enemyAttack(e)) return;
  }
  B.eboard.forEach(e => e.summonedNow = false);
  if (s.chip && B.eTurn >= 2) {
    say(s.say.chip, 1300); sfx('boss');
    B.village -= s.chip; renderBattle(); floatAt($('#hero'), '-' + s.chip); shakeEl($('#hero'));
    tip('chip', `<b>달이</b>: 재난 대장은 매 턴 마을을 조금씩 괴롭혀요(<b>잔펀치</b>). 오래 끌면 불리해요!`);
    await sleep(550);
    if (B.village <= 0) { await loseBattle(); return; }
  }
  await sleep(200);
  B.busy = false;
  await playerTurnStart(false);
}
async function enemyPlay(id) {

    if (B.hand.length < 6) {

      floatAt(elOf(fc), '✨ 반짝!', 'buff'); toast('누군가 손패에 반짝이는 카드를 넣었어요…', 1800); sfx('card'); await sleep(900);
      if (hasP('techeval')) { banner('🔍 기술 중심 평가! 바로 들통', 'gold'); await sleep(400); await exposeFakeInHand(fc); }
    }
    return;
  }
  const t = C[id];
  if (t.type === 'espell') {
    banner(`${t.art} ${t.name}! ${t.text}`, 'bad'); sfx('boss'); await sleep(600);
    if (id === 'wind') { B.eboard.forEach(e => e.bonusA += 1); renderBattle(); B.eboard.forEach(e => { floatAt(elOf(e), '+1', 'buff'); burst(elOf(e), ['🌬️'], 3); }); }
    if (id === 'thunder') {
      if (B.board.length) { const m = B.board.slice().sort((x, y) => (atkOf(y) || 0) - (atkOf(x) || 0))[0]; m.hp -= 3; renderBattle(); floatAt(elOf(m), '-3'); burst(elOf(m), ['⚡'], 6); screenShake(3); sfx('big'); await sleep(350); await cleanup(); }
      else { B.village -= 3; renderBattle(); floatAt($('#hero'), '-3'); shakeEl($('#hero')); if (B.village <= 0) { await loseBattle(); return; } }
    }
    if (id === 'fog') { const cand = B.board.filter(m => !m.frozen); if (cand.length) { const m = pick(cand); m.frozen = true; renderBattle(); floatAt(elOf(m), '🌫️ 쉬어요', 'info'); } }
    await sleep(450); return;
  }
  if (B.eboard.length >= 5) return;
  const e = makeCard({ id, temp: true }); e.summonedNow = true; e.enter = true;
  B.eboard.push(e); sfx('play'); renderBattle();
  if (Math.random() < .35) say(pick(s.say.play), 1100);
  if (e.kw.has('guard')) tip('eguard', `<b>달이</b>: 🛡️ 지켜요 재난! <b>이것부터 처리</b>해야 다른 재난이나 대장을 공격할 수 있어요.`);
  if (e.kw.has('rush')) tip('erush', `<b>달이</b>: ⚡ 즉시 출동 재난은 나오자마자 공격해요! 🛡️ 카드로 막아요.`);
  if (e.kw.has('hunter')) tip('ehunt', `<b>달이</b>: 🎯 고드름은 마을 대신 <b>가장 센 내 카드</b>를 노려요!`);
  await sleep(420);
}
async function enemyAttack(e) {
  const tgt = enemyTargetOf(e);
  const tEl = tgt === 'hero' ? $('#hero') : elOf(tgt);
  await lunge(elOf(e), tEl);
  const a = atkOf(e); sfx(a >= 4 ? 'big' : 'hit'); screenShake(a);
  if (tgt === 'hero') {
    B.village -= a; renderBattle(); floatAt($('#hero'), '-' + a, a >= 4 ? 'dmg big' : 'dmg'); shakeEl($('#hero'));
    await sleep(320);
    if (B.village <= 0) { await loseBattle(); return true; }
  } else {
    const da = atkOf(tgt) || 0;
    tgt.hp -= a; e.hp -= da;
    renderBattle(); floatAt(elOf(tgt), '-' + a); if (da > 0) floatAt(elOf(e), '-' + da);
    await sleep(280);
    if (e.hp <= 0 && tgt.hp > 0) await gainXp(tgt);
    await cleanup();
  }
  await sleep(120);
  return false;
}

/* ---------- 입력 ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  const act = el && el.dataset.act;
  if (act === 'sound') { G.sound = !G.sound; if (B && !B.over) renderBattle(); else if (!B) titleScreen(); return; }
  if (act === 'start') { sfx('play'); startGame(); return; }
  if (act === 'cutNext') { cutNext(); return; }
  if (act === 'cutSkip') { e.stopPropagation(); cutSkip(); return; }
  if (act === 'reqOk') { reqOk(); return; }
  if (act === 'afterWin') { afterWin(); return; }
  if (act === 'retry') { closeOverlay(); startBattle(); return; }
  if (act === 'polPick') { polPick(el.dataset.id, el); return; }
  if (act === 'dEye') { draftEye(el.dataset.id); return; }
  if (act === 'dPick') { draftPick(el.dataset.id); return; }
  if (act === 'dFeedback') { if (D && !D.done) feedbackScreen(); return; }
  if (act === 'fbBack') { if (D && !D.done) drawDraft(); return; }
  if (act === 'fbPick') { fbPick(+el.dataset.ref, el); return; }
  if (act === 'toTitle') { titleScreen(); return; }
  if (act === 'pol') { const P = POLICIES[el.dataset.id]; toast(`${P.i} ${P.n}: ${P.d}`, 2200); return; }
  if (act === 'share') {
    try { await navigator.clipboard.writeText(G.shareText); toast('결과를 복사했어요! 붙여넣어 자랑해요 📋'); } catch (err) { prompt('아래 글을 복사하세요', G.shareText); }
    return;
  }
  if (!B || B.over || !B.started) return;
  if (B.busy || B.turn !== 'player') { if (act && act !== 'end') toast('재난의 턴이에요. 잠깐만요!', 900); return; }
  const uid = el && +el.dataset.uid;
  const find = arr => arr.find(c => c.uid === uid);
  switch (act) {
    case 'hand': {
      const c = find(B.hand); if (!c) return;
      if (B.mode === 'eye') { useEye(c); return; }
      if (B.mode === 'spell' || B.mode === 'attack') { B.mode = null; B.attacker = null; B.spellCard = null; }
      if (B.sel === c.uid) { tryPlay(c); return; }
      B.sel = c.uid; sfx('card'); renderBattle(); showInfo(c);
      if (c.type === 'fake') tip('fakeinfo', `<b>달이</b>: 예산 1인데 5/5…? 이상하게 좋은데요. 🥽 안경으로 볼까요?`);
      return;
    }
    case 'mine': {
      const m = find(B.board); if (!m) return;
      if (B.mode === 'spell') { if (m.type !== 'new') { toast('🌱 새 기술 카드에만 쓸 수 있어요'); return; } castSpell(B.spellCard, m); return; }
      if (B.attacker === m.uid) { B.attacker = null; B.mode = null; renderBattle(); showInfo(null); return; }
      showInfo(m);
      if (m.frozenNow) { toast('❄️ 이번 턴엔 쉬어요'); return; }
      if (m.justPlayed && !m.canAttack) { toast('💤 다음 턴부터 처리할 수 있어요'); return; }
      if (!m.canAttack) { toast('이번 턴엔 이미 처리했어요'); return; }
      if (atkOf(m) <= 0) { toast('대응력이 0이라 막기만 해요'); return; }
      B.attacker = m.uid; B.mode = 'attack'; B.sel = null; sfx('card'); renderBattle(); return;
    }
    case 'foe': {
      const f = find(B.eboard); if (!f) return;
      if (B.mode === 'attack') { const att = B.board.find(m => m.uid === B.attacker); if (att) doAttack(att, f); return; }
      showInfo(f); return;
    }
    case 'boss': {
      if (B.mode === 'attack') { const att = B.board.find(m => m.uid === B.attacker); if (att) doAttack(att, 'boss'); return; }
      toast(`${S().art} ${S().boss}: 힘이 0이 되면 이 계절을 지켜내요! 절반 아래면 화가 나요.`, 2000); return;
    }
    case 'eye': {
      if (B.eyeUsed) { toast('🥽 안경은 턴마다 한 번이에요'); return; }
      if (B.mana < (hasP('techeval') ? 0 : 1)) { toast('예산이 모자라요 💰'); return; }
      if (B.mode === 'eye') { B.mode = null; renderBattle(); return; }
      B.mode = 'eye'; B.sel = null; B.attacker = null; renderBattle(); showInfo(null);
      toast('🥽 진짜 모습을 볼 손패 카드를 눌러요'); return;
    }
    case 'end': endTurn(); return;
    default:
      if (B.mode || B.sel) { B.mode = null; B.sel = null; B.attacker = null; B.spellCard = null; renderBattle(); showInfo(null); }
  }
});
document.addEventListener('mouseover', e => {
  if (!B || B.over || B.sel || B.mode === 'spell') return;
  const el = e.target.closest('.battle [data-uid]'); if (!el) return;
  const c = [...B.hand, ...B.board, ...B.eboard].find(x => x.uid === +el.dataset.uid); if (c) showInfo(c);
});
document.addEventListener('mouseout', e => {
  const el = e.target.closest && e.target.closest('.card');
  if (el && !el.contains(e.relatedTarget)) { el.style.setProperty('--rx', '0deg'); el.style.setProperty('--ry', '0deg'); }
  if (!B || B.sel || B.mode === 'spell') return;
  const bel = e.target.closest && e.target.closest('.battle [data-uid]'); if (bel && !bel.contains(e.relatedTarget)) showInfo(null);
});
document.addEventListener('mousemove', e => {
  const el = e.target.closest('.hand .card, .pitch .card, .fbgrid .card'); if (!el) return;
  const r = el.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
  el.style.setProperty('--ry', (x * 18) + 'deg'); el.style.setProperty('--rx', (-y * 18) + 'deg');
});

titleScreen();
</script>
</body>
</html>
